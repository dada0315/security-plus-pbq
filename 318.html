
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security+ 追加318問</title>
<style>
body{font-family:sans-serif;background:#f3f4f6;color:#111827;padding:16px;line-height:1.6}
main{max-width:650px;margin:auto}
section{background:white;padding:18px;border-radius:12px}
button{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;background:white;font-size:16px}
#status{white-space:pre-wrap}
</style>
</head>
<body>
<main>
<section>
<h1>Security+ 追加318問</h1>
<p id="status">問題データを確認しています…</p>
<div id="quiz" hidden>
<p id="number"></p>
<h3 id="question"></h3>
<div id="options"></div>
<p id="result"></p>
<button id="next" hidden onclick="nextQuestion()">次の問題</button>
</div>
</section>
</main>
<script>
let questions=[];
let pos=0;
let score=0;
let answered=false;

async function init(){
  try{
    const response=await fetch("https://dada0315.github.io/security-plus-pbq/questions318.json?v=3",{cache:"no-store"});
    if(!response.ok) throw Error("HTTP "+response.status);
    questions=await response.json();
    if(!Array.isArray(questions)||questions.length===0)
      throw Error("問題データが空です");
    document.getElementById("status").textContent=
      "読み込み成功："+questions.length+"問";
    document.getElementById("quiz").hidden=false;
    showQuestion();
  }catch(e){
    document.getElementById("status").textContent=
      "問題データの読み込みに失敗しました。\n"+
      e.message+"\n\nquestions318.jsonが同じ場所にあるか確認してください。";
  }
}

function showQuestion(){
  answered=false;
  const q=questions[pos];
  document.getElementById("number").textContent=
    "問題 "+(pos+1)+" / "+questions.length;
  document.getElementById("question").textContent=q.question;
  document.getElementById("result").textContent="";
  document.getElementById("next").hidden=true;
  const area=document.getElementById("options");
  area.innerHTML="";
  q.options.forEach((option,i)=>{
    const b=document.createElement("button");
    b.textContent=String.fromCharCode(65+i)+". "+option;
    b.onclick=()=>answer(i);
    area.appendChild(b);
  });
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=questions[pos];
  const ok=choice===q.answer;
  if(ok)score++;
  document.querySelectorAll("#options button").forEach(b=>b.disabled=true);
  document.getElementById("result").textContent=
    (ok?"正解！":"不正解。正解："+q.options[q.answer])+
    "\n"+(q.explanation||"解説は未登録です。");
  document.getElementById("next").hidden=false;
  document.getElementById("next").textContent=
    pos===questions.length-1?"結果を見る":"次の問題";
}

function nextQuestion(){
  if(!answered)return;
  pos++;
  if(pos>=questions.length){
    document.getElementById("quiz").hidden=true;
    document.getElementById("status").textContent=
      "学習終了！\n正解数："+score+" / "+questions.length+"問";
    return;
  }
  showQuestion();
}
init();
</script>
</body>
</html>
